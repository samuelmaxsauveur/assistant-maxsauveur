<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Créer un envoi Wing — Max Sauveur</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
        header { background: #111; color: white; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 18px; font-weight: 600; }
        header a { color: #aaa; text-decoration: none; font-size: 14px; }
        header a:hover { color: white; }
        .container { max-width: 600px; margin: 40px auto; padding: 0 16px; }
        .card { background: white; border-radius: 12px; padding: 32px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        h2 { font-size: 20px; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 500; color: #555; margin-bottom: 6px; }
        input, select { width: 100%; padding: 10px 14px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #111; }
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .btn { width: 100%; padding: 12px; background: #111; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; margin-top: 8px; }
        .btn:hover { background: #333; }
        .back { display: inline-block; color: #888; text-decoration: none; font-size: 14px; margin-bottom: 20px; }
        .back:hover { color: #333; }
        .result { margin-top: 20px; background: #e6f9ee; border-radius: 8px; padding: 16px; font-size: 14px; }
        .result h3 { color: #1a7a3e; margin-bottom: 8px; }
    </style>
</head>
<body>
    <header>
        <h1>📦 Créer un envoi Wing</h1>
        <a href="/">← Retour aux emails</a>
    </header>
    <div class="container">
        <div class="card">
            <h2>Nouveau retour / échange</h2>
            <form method="POST">
                <div class="form-group">
                    <label>Nom du client</label>
                    <input type="text" name="customer_name" required placeholder="Marie Dupont">
                </div>
                <div class="row-2">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="customer_email" required placeholder="marie@email.com">
                    </div>
                    <div class="form-group">
                        <label>Téléphone</label>
                        <input type="text" name="customer_phone" required placeholder="+33 6 00 00 00 00">
                    </div>
                </div>
                <div class="form-group">
                    <label>Adresse</label>
                    <input type="text" name="address" required placeholder="12 rue de la Paix">
                </div>
                <div class="row-2">
                    <div class="form-group">
                        <label>Ville</label>
                        <input type="text" name="city" required placeholder="Paris">
                    </div>
                    <div class="form-group">
                        <label>Code postal</label>
                        <input type="text" name="postal_code" required placeholder="75001">
                    </div>
                </div>
                <div class="form-group">
                    <label>Pays</label>
                    <select name="country">
                        <option value="FR">France</option>
                        <option value="BE">Belgique</option>
                        <option value="CH">Suisse</option>
                        <option value="LU">Luxembourg</option>
                    </select>
                </div>
                <button type="submit" class="btn">Créer l'envoi Wing →</button>
            </form>
            {% if result %}
            <div class="result">
                <h3>✅ Envoi créé</h3>
                <pre>{{ result | tojson(indent=2) }}</pre>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
